name: Validate, package and release

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Python ${{ matrix.python }} and browser checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Set up Node.js LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate semantic version and release source
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - name: Install and validate dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run server and migration tests
        run: python -m unittest -v test_app.py test_migrations.py
      - name: Compile server modules
        run: python -m compileall -q app.py account_routes.py auth_routes.py planning_routes.py statement_routes.py migrations.py
      - name: Check browser script syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
      - name: Run mortgage guide tests
        run: node --test test_mortgage_guide.js

  container:
    name: Build and smoke-test container
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image and verify persistence
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg "APP_VERSION=$(cat VERSION)" -t pocket-ledger:ci .
          name="ledger-smoke-${GITHUB_RUN_ID}"
          volume="ledger-smoke-data-${GITHUB_RUN_ID}"
          docker volume create "$volume"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
            -p 127.0.0.1:18080:5000 -v "$volume:/data" pocket-ledger:ci
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:18080/api/bootstrap >/dev/null; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json, urllib.request
          result = json.load(urllib.request.urlopen('http://127.0.0.1:18080/api/bootstrap'))
          assert result['user'] is None and result['version'] == open('VERSION').read().strip()
          PY
          [[ "$(docker exec "$name" id -u)" == 10001 ]]
          [[ "$(docker exec "$name" stat -c %a /data/secret.key)" == 600 ]]
          docker exec -i "$name" python - <<'PY'
          import sqlite3
          conn = sqlite3.connect('/data/ledger.sqlite3')
          assert conn.execute('PRAGMA user_version').fetchone()[0] == 4
          assert conn.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          conn.close()
          PY
          key_before="$(docker exec "$name" sha256sum /data/secret.key)"
          docker restart "$name"
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:18080/api/bootstrap >/dev/null; then break; fi
            sleep 2
          done
          [[ "$(docker exec "$name" sha256sum /data/secret.key)" == "$key_before" ]]

  publish:
    name: Publish provenance-enabled image to GHCR
    needs: [checks, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set image version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Enable ARM build emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable and release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release notes for the verified tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Pocket Ledger $GITHUB_REF_NAME"
