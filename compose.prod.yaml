services:
  ledger:
    image: ghcr.io/mariof1/pocket-ledger:${LEDGER_IMAGE_TAG:-0.3.1}
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LEDGER_HTTPS: ${LEDGER_HTTPS:-0}
      LEDGER_ALLOW_REGISTRATION: ${LEDGER_ALLOW_REGISTRATION:-1}
      LEDGER_LOG_LEVEL: ${LEDGER_LOG_LEVEL:-INFO}
      LEDGER_ACCESS_LOG: ${LEDGER_ACCESS_LOG:-1}
      LEDGER_LDAP_URL: ${LEDGER_LDAP_URL:-}
      LEDGER_LDAP_BASE_DN: ${LEDGER_LDAP_BASE_DN:-}
      LEDGER_LDAP_BIND_DN: ${LEDGER_LDAP_BIND_DN:-}
      LEDGER_LDAP_BIND_PASSWORD: ${LEDGER_LDAP_BIND_PASSWORD:-}
      LEDGER_LDAP_BIND_PASSWORD_FILE: ${LEDGER_LDAP_BIND_PASSWORD_FILE:-}
      LEDGER_LDAP_REQUIRED_GROUP: ${LEDGER_LDAP_REQUIRED_GROUP:-}
      LEDGER_LDAP_CA_CERT: ${LEDGER_LDAP_CA_CERT:-}
      LEDGER_LDAP_TLS_VERIFY: ${LEDGER_LDAP_TLS_VERIFY:-1}
      LEDGER_LDAP_START_TLS: ${LEDGER_LDAP_START_TLS:-0}
      LEDGER_LDAP_ALLOW_INSECURE: ${LEDGER_LDAP_ALLOW_INSECURE:-0}
    volumes:
      - ledger-data:/data

volumes:
  ledger-data:
